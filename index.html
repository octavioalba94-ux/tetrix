<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tetris Pro</title>
  <style>
    :root {
      --bg-color: #0b0e14;
      --panel-bg: #151922;
      --accent-color: #00f0ff;
      --text-color: #ffffff;
      --border-color: #2a2e3d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      display: flex;
      gap: 20px;
      background-color: var(--panel-bg);
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                  0 0 20px rgba(0, 240, 255, 0.1);
      border: 1px solid var(--border-color);
    }

    .game-board {
      position: relative;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      background-color: #000;
    }

    canvas {
      display: block;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 160px;
    }

    .panel-box {
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      margin-bottom: 15px;
    }

    .panel-box h3 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #8a8f9d;
      margin-bottom: 8px;
    }

    .panel-box .value {
      font-size: 22px;
      font-weight: bold;
      color: var(--accent-color);
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    .next-canvas {
      margin: 0 auto;
      display: block;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #00f0ff, #0072ff);
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-weight: bold;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0, 240, 255, 0.3);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 240, 255, 0.5);
    }

    .controls-hint {
      font-size: 11px;
      color: #6c727f;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="game-board">
      <canvas id="tetris" width="240" height="400"></canvas>
    </div>

    <div class="sidebar">
      <div>
        <div class="panel-box">
          <h3>Siguiente</h3>
          <canvas id="next" width="80" height="80" class="next-canvas"></canvas>
        </div>
        <div class="panel-box">
          <h3>Puntos</h3>
          <div id="score" class="value">0</div>
        </div>
        <div class="panel-box">
          <h3>Nivel</h3>
          <div id="level" class="value">1</div>
        </div>
        <div class="panel-box">
          <h3>Líneas</h3>
          <div id="lines" class="value">0</div>
        </div>
      </div>

      <div>
        <button id="start-btn" class="btn">Reiniciar</button>
        <div class="controls-hint" style="margin-top: 15px;">
          ← → : Mover<br>
          ↑ : Rotar<br>
          ↓ : Bajar
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    const nextCanvas = document.getElementById('next');
    const nextContext = nextCanvas.getContext('2d');

    context.scale(20, 20);
    nextContext.scale(20, 20);

    const COLORS = [
      null,
      '#FF0D72',
      '#0DC2FF',
      '#0DFF72',
      '#F538FF',
      '#FF8E0D',
      '#FFE138',
      '#3877FF'
    ];

    const PIECES = 'ILJOTSZ';

    function createMatrix(w, h) {
      const matrix = [];
      while (h--) {
        matrix.push(new Array(w).fill(0));
      }
      return matrix;
    }

    function createPiece(type) {
      if (type === 'I') {
        return [
          [0, 1, 0, 0],
          [0, 1, 0, 0],
          [0, 1, 0, 0],
          [0, 1, 0, 0],
        ];
      } else if (type === 'L') {
        return [
          [0, 2, 0],
          [0, 2, 0],
          [0, 2, 2],
        ];
      } else if (type === 'J') {
        return [
          [0, 3, 0],
          [0, 3, 0],
          [3, 3, 0],
        ];
      } else if (type === 'O') {
        return [
          [4, 4],
          [4, 4],
        ];
      } else if (type === 'Z') {
        return [
          [5, 5, 0],
          [0, 5, 5],
          [0, 0, 0],
        ];
      } else if (type === 'S') {
        return [
          [0, 6, 6],
          [6, 6, 0],
          [0, 0, 0],
        ];
      } else if (type === 'T') {
        return [
          [0, 7, 0],
          [7, 7, 7],
          [0, 0, 0],
        ];
      }
    }

    const arena = createMatrix(12, 20);

    const player = {
      pos: {x: 0, y: 0},
      matrix: null,
      nextMatrix: null,
      score: 0,
      lines: 0,
      level: 1
    };

    function collide(arena, player) {
      const [m, o] = [player.matrix, player.pos];
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] !== 0 &&
             (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    function arenaSweep() {
      let rowCount = 1;
      outer: for (let y = arena.length - 1; y > 0; --y) {
        for (let x = 0; x < arena[y].length; ++x) {
          if (arena[y][x] === 0) {
            continue outer;
          }
        }
        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        ++y;

        player.score += rowCount * 100;
        player.lines++;
        rowCount *= 2;
      }
      player.level = Math.floor(player.lines / 10) + 1;
      updateScore();
    }

    function drawMatrix(matrix, offset, ctx) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            ctx.fillStyle = COLORS[value];
            ctx.fillRect(x + offset.x, y + offset.y, 0.9, 0.9);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.fillRect(x + offset.x, y + offset.y, 0.9, 0.15);
            ctx.fillRect(x + offset.x, y + offset.y, 0.15, 0.9);
          }
        });
      });
    }

    function draw() {
      context.fillStyle = '#000';
      context.fillRect(0, 0, canvas.width, canvas.height);

      context.strokeStyle = '#11151c';
      context.lineWidth = 0.05;
      for (let x = 0; x < 12; x++) {
        for (let y = 0; y < 20; y++) {
          context.strokeRect(x, y, 1, 1);
        }
      }

      drawMatrix(arena, {x: 0, y: 0}, context);
      if (player.matrix) {
        drawMatrix(player.matrix, player.pos, context);
      }
    }

    function drawNext() {
      nextContext.fillStyle = '#151922';
      nextContext.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
      
      if (player.nextMatrix) {
        const xOffset = (4 - player.nextMatrix[0].length) / 2;
        const yOffset = (4 - player.nextMatrix.length) / 2;
        drawMatrix(player.nextMatrix, {x: xOffset, y: yOffset}, nextContext);
      }
    }

    function merge(arena, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            arena[y + player.pos.y][x + player.pos.x] = value;
          }
        });
      });
    }

    function rotate(matrix, dir) {
      for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
          [
            matrix[x][y],
            matrix[y][x],
          ] = [
            matrix[y][x],
            matrix[x][y],
          ];
        }
      }
      if (dir > 0) {
        matrix.forEach(row => row.reverse());
      } else {
        matrix.reverse();
      }
    }

    function playerDrop() {
      player.pos.y++;
      if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
      }
      dropCounter = 0;
    }

    function playerMove(offset) {
      player.pos.x += offset;
      if (collide(arena, player)) {
        player.pos.x -= offset;
      }
    }

    function playerReset() {
      if (!player.nextMatrix) {
        player.nextMatrix = createPiece(PIECES[PIECES.length * Math.random() | 0]);
      }
      
      player.matrix = player.nextMatrix;
      player.nextMatrix = createPiece(PIECES[PIECES.length * Math.random() | 0]);
      drawNext();

      player.pos.y = 0;
      player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

      if (collide(arena, player)) {
        arena.forEach(row => row.fill(0));
        player.score = 0;
        player.lines = 0;
        player.level = 1;
        updateScore();
      }
    }

    function playerRotate(dir) {
      const pos = player.pos.x;
      let offset = 1;
      rotate(player.matrix, dir);
      while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
          rotate(player.matrix, -dir);
          player.pos.x = pos;
          return;
        }
      }
    }

    let dropCounter = 0;
    let lastTime = 0;

    function update(time = 0) {
      const deltaTime = time - lastTime;
      lastTime = time;

      dropCounter += deltaTime;
      const dropInterval = Math.max(100, 1000 - (player.level - 1) * 100);

      if (dropCounter > dropInterval) {
        playerDrop();
      }

      draw();
      requestAnimationFrame(update);
    }

    function updateScore() {
      document.getElementById('score').innerText = player.score;
      document.getElementById('level').innerText = player.level;
      document.getElementById('lines').innerText = player.lines;
    }

    window.addEventListener('keydown', event => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.key)) {
        event.preventDefault();
      }

      if (event.key === 'ArrowLeft') {
        playerMove(-1);
      } else if (event.key === 'ArrowRight') {
        playerMove(1);
      } else if (event.key === 'ArrowDown') {
        playerDrop();
      } else if (event.key === 'ArrowUp') {
        playerRotate(1);
      }
    });

    document.getElementById('start-btn').addEventListener('click', () => {
      arena.forEach(row => row.fill(0));
      player.score = 0;
      player.lines = 0;
      player.level = 1;
      playerReset();
      updateScore();
    });

    playerReset();
    updateScore();
    update();
  </script>
</body>
</html>
